[project]
name = "yadf-scripts"
version = "0.1.0"
description = "Benchmarking, corpus generation, and reference tools for yadf"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]

[tool.pyright]
include = ["*.py"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["B", "C4", "I", "PIE", "RUF", "SIM", "UP"]
