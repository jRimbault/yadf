name: Release
on:
  push:
    tags:
      - "v*"
  # Lets the whole pipeline -- all five builds, packaging, checksums,
  # release notes -- be exercised on demand from a branch, with the two
  # irreversible calls (crates.io upload, GitHub release creation)
  # replaced by their dry-run/summary equivalents. See the `if: github.ref_type
  # == 'tag'` guards below: that is what is actually a real tag push versus
  # this trigger.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # `.cargo/config.toml` builds with `-C target-cpu=native` for local
  # benchmarking. A binary handed to someone else must not be tuned for the
  # runner that happened to build it, or it dies with SIGILL on any CPU
  # missing an instruction the compiler chose to emit. RUSTFLAGS takes
  # precedence over `build.rustflags`, so this pins the x86_64 jobs that
  # only compile for themselves (verify, publish) to the portable baseline;
  # the build matrix overrides it per target below.
  RUSTFLAGS: "-C target-cpu=x86-64"

jobs:
  # A tag that disagrees with Cargo.toml means either the wrong commit was
  # tagged or the version bump was forgotten. Both are cheaper to catch here
  # than after a crates.io upload, which cannot be undone. There is no tag to
  # compare against on a workflow_dispatch run, so this step is skipped
  # rather than comparing against a branch name.
  verify:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare tag with package version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "tag: $GITHUB_REF_NAME, Cargo.toml: $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  # Build sources for every OS
  github_build:
    name: Build release binaries
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        # `rustflags` is the portable CPU baseline for each target: never the
        # building runner's own CPU. `x86-64` is the base 64-bit instruction
        # set; `apple-a14` is the M1, which is the oldest Apple Silicon there
        # is. Every value is checked against `rustc --print target-cpus` --
        # a name valid for one architecture is rejected outright by another.
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: yadf-x86_64-unknown-linux-gnu.tar.gz
            rustflags: "-C target-cpu=x86-64"
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: yadf-x86_64-unknown-linux-musl.tar.gz
            rustflags: "-C target-cpu=x86-64"
          - target: x86_64-apple-darwin
            os: macos-latest
            name: yadf-x86_64-apple-darwin.tar.gz
            rustflags: "-C target-cpu=x86-64"
          - target: aarch64-apple-darwin
            os: macos-latest
            name: yadf-aarch64-apple-darwin.tar.gz
            rustflags: "-C target-cpu=apple-a14"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: yadf-x86_64-pc-windows-msvc.zip
            rustflags: "-C target-cpu=x86-64"
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare artifacts [Windows]
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.name }} yadf.exe
          cd -

      - name: Prepare artifacts [-nix]
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../${{ matrix.name }} yadf
          cd -

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  # Publish yadf to crates.io.
  #
  # Deliberately gated on the binaries building first: a crates.io version
  # can never be reused, so uploading before knowing the release is sound
  # burns the version number for good.
  publish:
    name: Publish crates.io package
    needs: [verify, github_build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        if: github.ref_type == 'tag'
        run: cargo publish --locked --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish (dry run)
        if: github.ref_type != 'tag'
        run: cargo publish --locked --dry-run

  # Create GitHub release with Rust build targets and release notes
  github_release:
    name: GitHub Release
    needs: github_build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Downloads every artifact of this run, each into a directory named
      # after it, which is what the `yadf-*/yadf-*` globs below expect.
      - uses: actions/download-artifact@v4

      - name: Build release notes
        run: |
          wget https://github.com/git-chglog/git-chglog/releases/download/0.9.1/git-chglog_linux_amd64 -O git-chglog
          chmod 744 git-chglog
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # On a real tag, `git describe --tags` at HEAD is exactly that
            # tag, so this is a single-tag query: commits since the
            # previous tag.
            query="$(git describe --tags)"
            ./git-chglog -c .github/chglog/release.yml "$query" >RELEASE.md
          else
            # No tag exists yet on a dispatch run, so `git describe --tags`
            # returns a pseudo-version (e.g. "v1.3.0-38-gabc1234") that
            # git-chglog cannot resolve as a tag. Preview the unreleased
            # commits instead: everything after the latest real tag.
            latest="$(git describe --tags --abbrev=0)"
            ./git-chglog -c .github/chglog/release.yml --next-tag HEAD "$latest.." >RELEASE.md
          fi

      - name: Compute checksums
        run: |
          echo >> RELEASE.md
          echo "### Checksums" >> RELEASE.md
          echo >> RELEASE.md
          echo "|File|sha256|" >> RELEASE.md
          echo "|---|---|" >> RELEASE.md
          for file in yadf-*/yadf-*; do
            sha="$(openssl dgst -sha256 -r "$file" | awk '{print $1}')"
            file="$(basename "$file")"
            echo "|${file}|\`${sha}\`|" >> RELEASE.md
          done

      - name: Publish
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: yadf-*/yadf-*
          body_path: RELEASE.md
          # A semver prerelease always has a hyphen (`-rc.1`, `-pre.2`); a
          # release tag never does. `endsWith(github.ref, 'pre')` only
          # matched a literal "...pre" suffix and missed every other
          # prerelease scheme, e.g. "-rc.1".
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (summary only)
        if: github.ref_type != 'tag'
        run: |
          {
            echo "### Dry run: no GitHub release created"
            echo
            echo "Would have uploaded:"
            for file in yadf-*/yadf-*; do
              echo "- \`$file\`"
            done
            echo
            cat RELEASE.md
          } >>"$GITHUB_STEP_SUMMARY"
