name: Release
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  # `.cargo/config.toml` builds with `-C target-cpu=native` for local
  # benchmarking. A binary handed to someone else must not be tuned for the
  # runner that happened to build it, or it dies with SIGILL on any CPU
  # missing an instruction the compiler chose to emit. RUSTFLAGS takes
  # precedence over `build.rustflags`, so this pins every job in this
  # workflow back to the portable baseline.
  RUSTFLAGS: "-C target-cpu=x86-64"

jobs:
  # A tag that disagrees with Cargo.toml means either the wrong commit was
  # tagged or the version bump was forgotten. Both are cheaper to catch here
  # than after a crates.io upload, which cannot be undone.
  verify:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare tag with package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "tag: $GITHUB_REF_NAME, Cargo.toml: $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  # Build sources for every OS
  github_build:
    name: Build release binaries
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          # - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: yadf-x86_64-unknown-linux-gnu.tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: yadf-x86_64-unknown-linux-musl.tar.gz
          # - target: x86_64-apple-darwin
          #  os: macOS-latest
          #  name: yadf-x86_64-apple-darwin.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: yadf-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare artifacts [Windows]
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.name }} yadf.exe
          cd -

      - name: Prepare artifacts [-nix]
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../${{ matrix.name }} yadf
          cd -

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  # Publish yadf to crates.io.
  #
  # Deliberately gated on the binaries building first: a crates.io version
  # can never be reused, so uploading before knowing the release is sound
  # burns the version number for good.
  publish:
    name: Publish crates.io package
    needs: [verify, github_build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --locked --token ${{ secrets.CRATES_IO_TOKEN }}

  # Create GitHub release with Rust build targets and release notes
  github_release:
    name: GitHub Release
    needs: github_build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Downloads every artifact of this run, each into a directory named
      # after it, which is what the `yadf-*/yadf-*` globs below expect.
      - uses: actions/download-artifact@v4

      - name: Build release notes
        run: |
          wget https://github.com/git-chglog/git-chglog/releases/download/0.9.1/git-chglog_linux_amd64 -O git-chglog
          chmod 744 git-chglog
          ./git-chglog -c .github/chglog/release.yml $(git describe --tags) > RELEASE.md

      - name: Compute checksums
        run: |
          echo >> RELEASE.md
          echo "### Checksums" >> RELEASE.md
          echo >> RELEASE.md
          echo "|File|sha256|" >> RELEASE.md
          echo "|---|---|" >> RELEASE.md
          for file in yadf-*/yadf-*; do
            sha="$(openssl dgst -sha256 -r "$file" | awk '{print $1}')"
            file="$(basename "$file")"
            echo "|${file}|\`${sha}\`|" >> RELEASE.md
          done

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: yadf-*/yadf-*
          body_path: RELEASE.md
          prerelease: ${{ endsWith(github.ref, 'pre') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
